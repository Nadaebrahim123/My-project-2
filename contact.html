<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact us and share your study plan.">
    <meta name="theme-color" content="#8f0050">
    <title>Plan Your Day - Contact Us</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>

<body>

    <a href="#main" class="skip-link">Skip to main content</a>

    <header>
        <h1>Plan Your Day</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" aria-current="page">Contact Us</a>
            <a href="components.html">Components</a>
        </nav>
    </header>

    <main id="main">

        <h2>Contact Us</h2>
        <p>Tell us about your study plan and daily schedule.</p>

        <div class="alert alert-success" role="status">
            <strong>Success:</strong>&nbsp;Your preferences will be saved.
        </div>

        <form action="#" method="post">

            <fieldset>
                <legend>Your Information</legend>

                <div class="field">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required autocomplete="name">
                </div>

                <div class="field">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="field">
                    <label for="hours">Study Hours:</label>
                    <input type="number" id="hours" name="hours" min="1" max="24" autocomplete="off">
                </div>

                <div class="field">
                    <label for="date">Study Date:</label>
                    <input type="date" id="date" name="date" autocomplete="off">
                </div>
            </fieldset>

            <fieldset>
                <legend>What is your study level?</legend>
                <div class="radio-group">
                    <label><input type="radio" name="level" value="beginner"> Beginner</label>
                    <label><input type="radio" name="level" value="intermediate"> Intermediate</label>
                    <label><input type="radio" name="level" value="advanced"> Advanced</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Which subjects do you study?</legend>
                <div class="check-group">
                    <label><input type="checkbox" name="subject" value="math"> Math</label>
                    <label><input type="checkbox" name="subject" value="physics"> Physics</label>
                    <label><input type="checkbox" name="subject" value="computer"> Computer Science</label>
                </div>
            </fieldset>

            <div class="field">
                <label for="time">Preferred Study Time:</label>
                <select id="time" name="time">
                    <option value="morning">Morning</option>
                    <option value="afternoon">Afternoon</option>
                    <option value="evening">Evening</option>
                    <option value="night">Night</option>
                </select>
            </div>

            <div class="field">
                <label for="message">Your Goals or Notes:</label>
                <textarea id="message" name="message" rows="6"></textarea>
            </div>

            <button type="submit" class="btn">Submit</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Plan Your Day</p>
    </footer>

</body>
</html>
